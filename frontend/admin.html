<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Settings | My Personal Assistant</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/styles.css"></head>
<body><header class="site-header"><div class="shell header-inner"><a class="brand" href="/index.html"><span data-brand-logo>🤖</span><span data-brand-name>My Personal Assistant</span></a><div class="header-meta">Today <span data-usage-time>00:00:00</span> / 08:00:00</div></div></header>
<div class="shell page-grid"><div data-navigation></div><main><section class="panel p-6 max-w-3xl"><p class="eyebrow">Configuration</p><h1 class="page-title">Admin Settings</h1><p class="muted mb-6">Single-user configuration. The API key is masked when settings are read back.</p>
<form id="settingsForm" class="space-y-5"><label>Platform name<input id="platformName" class="input mt-1" maxlength="100" required></label>
<label>Platform icon / logo<input id="logo" class="input mt-1" maxlength="20" placeholder="🤖"></label>
<label>Gemini API key<input id="geminiKey" type="password" class="input mt-1" maxlength="500" placeholder="Enter a new key or leave unchanged"></label>
<label>Gemini model<input id="geminiModel" class="input mt-1" maxlength="100"></label>
<label>Default Excel storage mode<select id="defaultMode" class="input mt-1"><option value="append">Append</option><option value="new">New file</option></select></label>
<div class="flex items-center gap-3"><button class="primary">Save Settings</button><span id="settingsMessage" class="muted text-sm"></span></div></form></section></main></div>
<script src="/app.js"></script><script>window.MPA_PAGE="admin";</script></body></html>
